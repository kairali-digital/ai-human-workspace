name: Deploy approved training portal

on:
  push:
    branches: [main]
    paths:
      - "portal/**"
      - ".github/workflows/portal-deploy.yml"
      - "packages/kairali/**"
      - "component-manifest.json"
      - "release-manifest.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kairali-training-portal-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npm run validate
      - run: npm run typecheck
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@56.5.0
      - name: Pull production settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build production artifact
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy validated artifact
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
