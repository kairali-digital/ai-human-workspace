name: Deploy approved training portal

on:
  push:
    branches: [main]
    paths:
      - "portal/**"
      - ".github/workflows/portal-deploy.yml"
      - "packages/kairali/**"
      - "component-manifest.json"
      - "release-manifest.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kairali-training-portal-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuse an unapproved release or candidate-only portal
        working-directory: ${{ github.workspace }}
        run: |
          python3 scripts/validate_release.py .
          python3 scripts/validate_portal_deploy.py .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run validate
      - run: npm run typecheck
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@56.5.0
      - name: Pull production settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build production artifact
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy validated artifact
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
