name: Windows edition upgrade and rollback qualification
on:
  push:
    branches: [agent/windows-actions-v250]
    paths:
      - .github/workflows/windows-edition-qa.yml
      - .github/ci/windows_edition_upgrade.py
permissions:
  contents: read
jobs:
  editions:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: harness
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 17367141f9c03e41d02238ae481c10ee01fcf343
          persist-credentials: false
          path: candidate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Verify packaged upgrade and rollback on disposable workers
        shell: powershell
        env:
          PYTHONUTF8: '1'
        run: |
          python -m pip install --require-hashes -r candidate/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B harness/.github/ci/windows_edition_upgrade.py candidate
