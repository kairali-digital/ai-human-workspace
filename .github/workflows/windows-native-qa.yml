name: Windows native update scheduler qualification
on:
  push:
    branches: [agent/windows-actions-v250]
    paths:
      - .github/workflows/windows-native-qa.yml
      - .github/ci/windows_native_qa.py
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: harness
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 167617cf2a2356960940bf649e773c567eb464c3
          persist-credentials: false
          path: candidate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Verify native scheduling and cleanup in a disposable worker
        shell: powershell
        env:
          PYTHONUTF8: '1'
        run: |
          python -m pip install --require-hashes -r candidate/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B harness/.github/ci/windows_native_qa.py candidate
